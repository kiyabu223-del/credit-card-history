<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="カード利用履歴">
<link rel="manifest" href="manifest.webmanifest">
<title>クレジットカード利用履歴</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--blue:#0a84ff;--line:#e5e7eb;--danger:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.95);backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;text-align:center}
.wrap{max-width:720px;margin:auto;padding:14px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
button{font:inherit}.iconbtn{border:0;background:transparent;font-size:28px;color:var(--blue);padding:8px 14px}
.monthtitle{font-weight:700}
.summary{background:linear-gradient(135deg,#eaf4ff,#f8fbff);border:1px solid #d7eaff;border-radius:18px;padding:18px;margin-bottom:14px}
.summary .label{font-size:13px;color:var(--muted)}.summary .total{font-size:34px;font-weight:800;margin-top:2px}.summary .count{font-size:13px;color:var(--muted);margin-top:4px}
.table-card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.thead,.row{display:grid;grid-template-columns:72px 1fr 92px;gap:8px;align-items:center;padding:11px 12px}
.thead{background:#f9fafb;color:var(--muted);font-size:12px;font-weight:700}.row{border-top:1px solid var(--line);font-size:14px}
.row button{all:unset;display:contents;cursor:pointer}.amount{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:28px;text-align:center;color:var(--muted)}
.actions{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:20}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;flex:1}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf4ff;color:#0066cc}.ghost{background:#f3f4f6}.danger{background:#fee2e2;color:#b91c1c}
dialog{width:min(92vw,560px);border:0;border-radius:20px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}.modal{padding:18px}.modal h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}input{width:100%;font:inherit;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
.modal-actions{display:flex;gap:10px;margin-top:16px}.preview{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#f3f4f6;margin:8px 0}
.ocr-status{font-size:13px;color:var(--muted);margin:8px 0}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--blue);transition:width .2s}
.small{font-size:12px;color:var(--muted);line-height:1.5}.hidden{display:none!important}
.capture-step{padding:12px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fafafa}
.capture-step.done{background:#eef8ff;border-color:#b8dcff}
.capture-step strong{display:block;margin-bottom:4px}
.capture-row{display:flex;gap:8px;margin-top:8px}
.capture-row .btn{padding:10px 12px}
.status-ok{font-size:12px;color:#087f5b;margin-top:6px}
.status-wait{font-size:12px;color:var(--muted);margin-top:6px}
.debug{margin-top:12px;padding:10px;border:1px dashed #d1d5db;border-radius:10px;font-size:11px;color:#6b7280;white-space:pre-wrap;max-height:130px;overflow:auto}
</style>
</head>
<body>
<header><h1>クレジットカード利用履歴</h1></header>
<main class="wrap">
  <div class="monthbar">
    <button id="prevMonth" class="iconbtn">‹</button>
    <div id="monthTitle" class="monthtitle"></div>
    <button id="nextMonth" class="iconbtn">›</button>
  </div>
  <section class="summary">
    <div class="label">今月の利用額</div>
    <div id="monthTotal" class="total">¥0</div>
    <div id="monthCount" class="count">0件</div>
  </section>
  <section class="table-card">
    <div class="thead"><div>日付</div><div>利用店</div><div class="amount">金額</div></div>
    <div id="rows"></div>
  </section>
</main>
<div class="actions">
  <button id="scanBtn" class="btn primary">📷 レシート撮影</button>
  <button id="manualBtn" class="btn secondary">✏️ 手動入力</button>
</div>

<input id="receiptInput" class="hidden" type="file" accept="image/*" capture="environment">
<input id="fullInput" class="hidden" type="file" accept="image/*" capture="environment">
<input id="merchantInputPhoto" class="hidden" type="file" accept="image/*" capture="environment">
<input id="amountInputPhoto" class="hidden" type="file" accept="image/*" capture="environment">

<dialog id="entryDialog">
  <form id="entryForm" class="modal">
    <h2 id="entryTitle">手動入力</h2>
    <img id="receiptPreview" class="preview hidden" alt="レシート画像">
    <div id="ocrBox" class="hidden">
      <div id="ocrStatus" class="ocr-status">読み取り中…</div>
      <div class="progress"><div id="ocrProgress"></div></div>
    </div>

    <label>日付</label>
    <input id="dateInput" type="date" required>

    <label>利用店</label>
    <input id="merchantInput" type="text" required>

    <label>金額</label>
    <input id="amountInput" type="number" min="1" inputmode="numeric" required>

    <p id="ocrHint" class="small hidden">OCR結果は必ず保存前に確認してください。</p>
    <div id="debugBox" class="debug hidden"></div>

    <div class="modal-actions">
      <button type="button" id="deleteBtn" class="btn danger hidden">削除</button>
      <button type="button" id="cancelBtn" class="btn ghost">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="captureDialog">
  <div class="modal">
    <h2>レシートを3枚撮影</h2>
    <p class="small">小さい文字を読みやすくするため、全体・店名・合計を別々に撮ります。</p>

    <div id="stepFull" class="capture-step">
      <strong>1. レシート全体</strong>
      <div class="small">日付と全体構造を読み取ります。</div>
      <div class="capture-row">
        <button type="button" id="fullPhotoBtn" class="btn secondary">全体を撮影</button>
      </div>
      <div id="fullStatus" class="status-wait">未撮影</div>
    </div>

    <div id="stepMerchant" class="capture-step">
      <strong>2. 店名をアップ</strong>
      <div class="small">店名が画面いっぱいになるくらい近づけて撮影してください。</div>
      <div class="capture-row">
        <button type="button" id="merchantPhotoBtn" class="btn secondary">店名を撮影</button>
      </div>
      <div id="merchantStatus" class="status-wait">未撮影</div>
    </div>

    <div id="stepAmount" class="capture-step">
      <strong>3. 合計をアップ</strong>
      <div class="small">「合計」と金額が一緒に入るように撮影してください。</div>
      <div class="capture-row">
        <button type="button" id="amountPhotoBtn" class="btn secondary">合計を撮影</button>
      </div>
      <div id="amountStatus" class="status-wait">未撮影</div>
    </div>

    <div class="modal-actions">
      <button type="button" id="captureCancelBtn" class="btn ghost">キャンセル</button>
      <button type="button" id="analyzeMultiBtn" class="btn primary" disabled>3枚を読み取る</button>
    </div>
  </div>
</dialog>

<script>
const DATA_KEY='credit-card-history-v3';
const LEARN_KEY='credit-card-history-merchant-learning-v3';

const $=s=>document.querySelector(s);
let items=loadJSON(DATA_KEY,[]);
let current=new Date(); current.setDate(1);
let editingId=null;
let pendingMerchantSignature='';

function loadJSON(key,fallback){
  try{
    const v=JSON.parse(localStorage.getItem(key)||'null');
    return v ?? fallback;
  }catch{return fallback}
}
function saveJSON(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}
function migrateOld(){
  if(items.length)return;
  for(const key of ['credit-card-history-v2','credit-card-history-v1']){
    const old=loadJSON(key,[]);
    if(Array.isArray(old)&&old.length){
      items=old.map(({image,...x})=>x);
      try{saveJSON(DATA_KEY,items)}catch{}
      break;
    }
  }
}
migrateOld();

let merchantLearning=loadJSON(LEARN_KEY,[]);
if(!Array.isArray(merchantLearning)) merchantLearning=[];

function monthKey(d){
  const x=new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;
}
function fmtYen(n){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n||0)}
function fmtDate(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function isoToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function render(){
  $('#monthTitle').textContent=`${current.getFullYear()}年${current.getMonth()+1}月`;
  const key=monthKey(current);
  const list=items.filter(x=>x.date?.startsWith(key)).sort((a,b)=>b.date.localeCompare(a.date));
  $('#monthTotal').textContent=fmtYen(list.reduce((s,x)=>s+Number(x.amount||0),0));
  $('#monthCount').textContent=`${list.length}件`;
  const rows=$('#rows'); rows.innerHTML='';
  if(!list.length){rows.innerHTML='<div class="empty">利用履歴がありません</div>';return}
  for(const item of list){
    const div=document.createElement('div'); div.className='row';
    div.innerHTML=`<button data-id="${item.id}"><div>${fmtDate(item.date)}</div><div>${escapeHtml(item.merchant)}</div><div class="amount">${fmtYen(item.amount)}</div></button>`;
    div.querySelector('button').onclick=()=>openEdit(item.id);
    rows.appendChild(div);
  }
}

function resetDialog(){
  $('#receiptPreview').classList.add('hidden');
  $('#ocrBox').classList.add('hidden');
  $('#ocrHint').classList.add('hidden');
  $('#debugBox').classList.add('hidden');
  $('#debugBox').textContent='';
  pendingMerchantSignature='';
}
function openManual(){
  editingId=null; resetDialog();
  $('#entryTitle').textContent='手動入力';
  $('#dateInput').value=isoToday(); $('#merchantInput').value=''; $('#amountInput').value='';
  $('#deleteBtn').classList.add('hidden');
  $('#entryDialog').showModal();
}
function openEdit(id){
  const x=items.find(i=>i.id===id); if(!x)return;
  editingId=id; resetDialog();
  $('#entryTitle').textContent='利用履歴を編集';
  $('#dateInput').value=x.date; $('#merchantInput').value=x.merchant; $('#amountInput').value=x.amount;
  $('#deleteBtn').classList.remove('hidden');
  $('#entryDialog').showModal();
}

$('#entryForm').addEventListener('submit',e=>{
  e.preventDefault();
  const date=$('#dateInput').value;
  const merchant=$('#merchantInput').value.trim();
  const amount=Number($('#amountInput').value);
  if(!date||!merchant||!Number.isFinite(amount)||amount<=0){alert('日付・利用店・金額を確認してください。');return}

  const record={id:editingId||(crypto.randomUUID?crypto.randomUUID():String(Date.now())),date,merchant,amount};
  const before=items.slice();
  if(editingId)items=items.map(x=>x.id===editingId?record:x); else items.push(record);

  try{
    saveJSON(DATA_KEY,items);
    if(pendingMerchantSignature){
      const idx=merchantLearning.findIndex(x=>x.signature===pendingMerchantSignature);
      const learned={signature:pendingMerchantSignature,merchant,updatedAt:Date.now()};
      if(idx>=0)merchantLearning[idx]=learned;else merchantLearning.push(learned);
      merchantLearning=merchantLearning.slice(-100);
      saveJSON(LEARN_KEY,merchantLearning);
    }
    $('#entryDialog').close();
    const d=new Date(date+'T00:00:00');current=new Date(d.getFullYear(),d.getMonth(),1);render();
  }catch(err){
    items=before; alert('保存に失敗しました。');
  }
});
$('#cancelBtn').onclick=()=>$('#entryDialog').close();
$('#deleteBtn').onclick=()=>{
  if(!editingId)return;
  if(confirm('この利用履歴を削除しますか？')){
    items=items.filter(x=>x.id!==editingId);
    saveJSON(DATA_KEY,items); $('#entryDialog').close(); render();
  }
};
$('#manualBtn').onclick=openManual;
$('#prevMonth').onclick=()=>{current.setMonth(current.getMonth()-1);render()};
$('#nextMonth').onclick=()=>{current.setMonth(current.getMonth()+1);render()};

let multiPhotos={full:null,merchant:null,amount:null};

function resetMultiCapture(){
  multiPhotos={full:null,merchant:null,amount:null};
  for(const [kind,label] of [['full','full'],['merchant','merchant'],['amount','amount']]){
    const st=$(`#${label}Status`);
    const step=$(`#step${label.charAt(0).toUpperCase()+label.slice(1)}`);
    if(st){st.textContent='未撮影';st.className='status-wait'}
    if(step)step.classList.remove('done');
  }
  $('#analyzeMultiBtn').disabled=true;
}
function updateCaptureState(kind,file){
  multiPhotos[kind]=file;
  const map={full:['fullStatus','stepFull'],merchant:['merchantStatus','stepMerchant'],amount:['amountStatus','stepAmount']};
  const [statusId,stepId]=map[kind];
  $(`#${statusId}`).textContent='撮影済み ✓';
  $(`#${statusId}`).className='status-ok';
  $(`#${stepId}`).classList.add('done');
  $('#analyzeMultiBtn').disabled=!(multiPhotos.full&&multiPhotos.merchant&&multiPhotos.amount);
}
$('#scanBtn').onclick=()=>{
  resetMultiCapture();
  $('#captureDialog').showModal();
};
$('#captureCancelBtn').onclick=()=>$('#captureDialog').close();
$('#fullPhotoBtn').onclick=()=>$('#fullInput').click();
$('#merchantPhotoBtn').onclick=()=>$('#merchantInputPhoto').click();
$('#amountPhotoBtn').onclick=()=>$('#amountInputPhoto').click();

$('#fullInput').addEventListener('change',e=>{const f=e.target.files?.[0];e.target.value='';if(f)updateCaptureState('full',f)});
$('#merchantInputPhoto').addEventListener('change',e=>{const f=e.target.files?.[0];e.target.value='';if(f)updateCaptureState('merchant',f)});
$('#amountInputPhoto').addEventListener('change',e=>{const f=e.target.files?.[0];e.target.value='';if(f)updateCaptureState('amount',f)});


function normalizeText(s){
  return String(s||'')
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[，､]/g,',')
    .replace(/[￥]/g,'¥')
    .replace(/\u3000/g,' ');
}
function bboxOf(w){
  const b=w?.bbox||{};
  return {x0:+(b.x0||0),y0:+(b.y0||0),x1:+(b.x1||0),y1:+(b.y1||0)};
}
function wordText(w){return normalizeText(w?.text||'').trim()}

function collectWords(data){
  if(Array.isArray(data.words)&&data.words.length)return data.words;
  const out=[];
  for(const block of (data.blocks||[]))
    for(const para of (block.paragraphs||[]))
      for(const line of (para.lines||[]))
        for(const word of (line.words||[]))out.push(word);
  return out;
}
function groupLines(words){
  const ws=words.map(w=>({text:wordText(w),box:bboxOf(w),conf:+(w.confidence||0)}))
    .filter(w=>w.text&&w.box.y1>w.box.y0)
    .sort((a,b)=>a.box.y0-b.box.y0||a.box.x0-b.box.x0);
  const lines=[];
  for(const w of ws){
    const cy=(w.box.y0+w.box.y1)/2, h=Math.max(1,w.box.y1-w.box.y0);
    let best=null,dist=1e9;
    for(const l of lines){
      const d=Math.abs(cy-l.cy);
      if(d<Math.max(h,l.avgH)*0.62&&d<dist){best=l;dist=d}
    }
    if(!best){best={words:[],cy,avgH:h};lines.push(best)}
    best.words.push(w);
    const n=best.words.length;
    best.cy=(best.cy*(n-1)+cy)/n;
    best.avgH=(best.avgH*(n-1)+h)/n;
  }
  for(const l of lines)l.words.sort((a,b)=>a.box.x0-b.box.x0);
  return lines.sort((a,b)=>a.cy-b.cy);
}

async function preprocess(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const maxW=1800,scale=Math.min(1,maxW/img.naturalWidth);
    const w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
    const im=ctx.getImageData(0,0,w,h),d=im.data;
    for(let i=0;i<d.length;i+=4){
      const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
      let v=(g-128)*1.45+128; v=Math.max(0,Math.min(255,v));
      if(v>225)v=255;
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(im,0,0);return c;
  }finally{URL.revokeObjectURL(url)}
}

function parseDate(text){
  const t=normalizeText(text);
  const pats=[
    /(20\d{2})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/,
    /(\d{2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/
  ];
  for(const p of pats){
    const m=t.match(p); if(!m)continue;
    let y=+m[1];if(y<100)y+=2000;const mo=+m[2],d=+m[3];
    if(mo>=1&&mo<=12&&d>=1&&d<=31)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  return '';
}

function moneyNumber(s){
  let t=normalizeText(s).replace(/\s/g,'').replace(/[¥￥円]/g,'');
  t=t.replace(/[，]/g,',').replace(/\.00$/,'');
  if(!/^\d[\d,]*$/.test(t))return null;
  const n=Number(t.replace(/,/g,''));
  return Number.isFinite(n)&&n>=10&&n<10000000?n:null;
}
function moneyPieces(line){
  const ws=line.words;
  const res=[];
  // single word
  for(const w of ws){const n=moneyNumber(w.text);if(n)res.push({n,text:w.text,x0:w.box.x0,x1:w.box.x1,h:w.box.y1-w.box.y0,parts:1})}
  // join nearby pieces up to 4 words: 1 , 234 / 1 234 / ¥ 1,234
  for(let i=0;i<ws.length;i++){
    let txt='',x0=ws[i].box.x0,x1=ws[i].box.x1,h=0;
    for(let j=i;j<Math.min(ws.length,i+4);j++){
      if(j>i){
        const gap=ws[j].box.x0-ws[j-1].box.x1;
        const ph=ws[j-1].box.y1-ws[j-1].box.y0,ch=ws[j].box.y1-ws[j].box.y0;
        if(gap>Math.max(14,(ph+ch)/2*1.05))break;
      }
      const piece=normalizeText(ws[j].text).replace(/\s/g,'');
      if(!/^[¥￥円\d,，.・]+$/.test(piece))break;
      txt+=piece;x1=ws[j].box.x1;h=Math.max(h,ws[j].box.y1-ws[j].box.y0);
      let norm=txt.replace(/[，・]/g,',').replace(/\s/g,'');
      // If OCR splits "1" and "234" without comma, concatenate.
      const n=moneyNumber(norm);
      if(n&&j>i)res.push({n,text:txt,x0,x1,h,parts:j-i+1});
    }
  }
  return res;
}

function parseAmount(lines){
  const excl=/小計|消費税|税率|内税|外税|釣銭|お釣|預り|預かり|ポイント|値引|割引/;
  const total=/総?合計|お支払(?:い)?額?|ご請求額?|請求額|支払額|取引金額|カード支払|クレジット支払/;
  const allH=[];let maxX=1;
  lines.forEach(l=>l.words.forEach(w=>{allH.push(w.box.y1-w.box.y0);maxX=Math.max(maxX,w.box.x1)}));
  allH.sort((a,b)=>a-b);const med=allH[Math.floor(allH.length/2)]||1;
  const cands=[];
  const add=(m,l,i,base,why)=>{
    const hr=(m.h||l.avgH)/med,rr=m.x1/maxX;
    let score=base;
    if(hr>1.15)score+=Math.min(35,(hr-1)*30);
    if(rr>.72)score+=(rr-.72)*35;
    if(m.parts>1)score+=12;
    if(/[¥￥円]/.test(m.text))score+=8;
    cands.push({...m,score,why,line:i});
  };
  lines.forEach((l,i)=>{
    const raw=l.words.map(w=>w.text).join(' ');
    const joined=raw.replace(/\s/g,'');
    if(excl.test(joined))return;
    const ms=moneyPieces(l);
    const isTotal=total.test(joined);
    if(isTotal){
      let labelEnd=0;
      l.words.forEach((w,k)=>{
        const s=l.words.slice(0,k+1).map(x=>x.text).join('').replace(/\s/g,'');
        if(total.test(s))labelEnd=Math.max(labelEnd,w.box.x1);
      });
      ms.forEach(m=>add(m,l,i,m.x0>=labelEnd-5?180:105,'total-line'));
      for(let j=i+1;j<=Math.min(i+2,lines.length-1);j++){
        if(excl.test(lines[j].words.map(w=>w.text).join('')))continue;
        moneyPieces(lines[j]).forEach(m=>add(m,lines[j],j,j===i+1?115:90,'below-total'));
      }
    }
    ms.forEach(m=>{
      const hr=(m.h||l.avgH)/med,rr=m.x1/maxX;
      if(hr>1.25||rr>.82)add(m,l,i,35,'large-or-right');
    });
  });
  if(!cands.length)return '';
  const freq={};cands.forEach(c=>freq[c.n]=(freq[c.n]||0)+1);
  cands.forEach(c=>{if(freq[c.n]>1)c.score+=15*(freq[c.n]-1)});
  cands.sort((a,b)=>b.score-a.score||b.n-a.n);
  console.log('amount candidates',cands.slice(0,10));
  return cands[0]?.n||'';
}

function simplify(s){
  return normalizeText(s).toUpperCase().replace(/\s+/g,'').replace(/[^\p{L}\p{N}]/gu,'');
}
function signature(s){
  const x=simplify(s);const g=[];
  for(let i=0;i<x.length-1;i++)g.push(x.slice(i,i+2));
  return [...new Set(g)].sort().join('|').slice(0,700);
}
function sigSim(a,b){
  const A=new Set(String(a||'').split('|').filter(Boolean)),B=new Set(String(b||'').split('|').filter(Boolean));
  if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>{if(B.has(x))n++});return n/(A.size+B.size-n);
}
const KNOWN=[
['セブン-イレブン',/セブン.?イレブン|7.?ELEVEN|SEVEN.?ELEVEN/i],
['ファミリーマート',/ファミリ.?マート|FAMILY.?MART/i],
['ローソン',/ローソン|LAWSON/i],['イオン',/イオン|AEON/i],['ヤオコー',/ヤオコー|YAOKO/i],
['ベルク',/ベルク|BELC/i],['マルエツ',/マルエツ|MARUETSU/i],['ライフ',/(?:^|\s)ライフ(?:\s|$)|LIFE/i],
['マツモトキヨシ',/マツモト.?キヨシ|MATSUMOTO.?KIYOSHI/i],['ウエルシア',/ウエルシア|WELCIA/i],
['ロイヤルホスト',/ロイヤル.?ホスト|ROYAL.?HOST/i],['ガスト',/ガスト|GUSTO/i],['サイゼリヤ',/サイゼリヤ|SAIZERIYA/i],
['デニーズ',/デニーズ|DENNY/i],['マクドナルド',/マクドナルド|MCDONALD/i],['スターバックス',/スターバックス|STARBUCKS/i],
['ドトール',/ドトール|DOUTOR/i],['ユニクロ',/ユニクロ|UNIQLO/i],['ニトリ',/ニトリ|NITORI/i]
];

function parseMerchant(lines,pageHeight){
  const blacklist=/TEL|電話|FAX|住所|〒|レシート|領収|担当|日時|日付|合計|小計|消費税|税率|現金|釣銭|お預り|クレジット|カード|番号|登録番号|営業時間|取引|商品|単価|数量|税込|税抜|ありがとう|毎度|http|www/i;
  const heights=[];lines.forEach(l=>l.words.forEach(w=>heights.push(w.box.y1-w.box.y0)));
  heights.sort((a,b)=>a-b);const med=heights[Math.floor(heights.length/2)]||1;
  const cands=[];
  lines.forEach((l,i)=>{
    const y=l.cy/(pageHeight||1); if(y>.38)return;
    const t=l.words.map(w=>w.text).join(' ').replace(/\s+/g,' ').trim();
    if(t.length<2||t.length>60||blacklist.test(t))return;
    const letters=(t.match(/[A-Za-z\u3040-\u30ff\u3400-\u9fff]/g)||[]).length;
    const digits=(t.match(/\d/g)||[]).length;
    if(letters<2||digits>Math.max(3,t.length*.35))return;
    let score=70-y*90+(l.avgH/med)*20;
    if(/店$|支店$|本店$|STORE|SHOP|CAFE|MART|DINER|HOTEL/i.test(t))score+=14;
    if(/[都道府県市区町村]\S*\d/.test(t))score-=20;
    cands.push({t,score});
  });
  cands.sort((a,b)=>b.score-a.score);
  const context=cands.slice(0,3).map(x=>x.t).join(' ');
  const sig=signature(context);

  let learned=null;
  for(const r of merchantLearning){
    const sim=sigSim(sig,r.signature);
    if(sim>=.22&&(!learned||sim>learned.sim))learned={merchant:r.merchant,sim};
  }
  if(learned)return {merchant:learned.merchant,signature:sig};

  for(const c of cands.slice(0,10)){
    for(const [name,re] of KNOWN)if(re.test(c.t))return {merchant:name,signature:sig};
  }
  return {merchant:cands[0]?.t||'',signature:sig};
}

  $('#receiptPreview').src=URL.createObjectURL(file);$('#receiptPreview').classList.remove('hidden');
  $('#ocrBox').classList.remove('hidden');$('#ocrHint').classList.remove('hidden');
  $('#dateInput').value='';$('#merchantInput').value='';$('#amountInput').value='';

    $('#ocrStatus').textContent='レシート全体を読み取り中…';

    const result=await Tesseract.recognize(canvas,'jpn+eng',{
      logger:m=>{
        if(m.status==='recognizing text'){
          const p=Math.round((m.progress||0)*100);
          $('#ocrProgress').style.width=p+'%';

      }
    });

async function recognizeOne(file,label,startPct,endPct){
  const canvas=await preprocess(file);
  const result=await Tesseract.recognize(canvas,'jpn+eng',{
    logger:m=>{
      if(m.status==='recognizing text'){
        const p=Math.round(startPct+(endPct-startPct)*(m.progress||0));
        $('#ocrProgress').style.width=p+'%';
        $('#ocrStatus').textContent=`${label}を読み取り中… ${p}%`;
      }
    }
  });
  const data=result.data||{};
  return {
    canvas,
    text:data.text||'',
    words:collectWords(data),
    lines:groupLines(collectWords(data))
  };
}

function parseMerchantZoom(lines,pageHeight,text){
  // 拡大写真では店名が大きく写っている前提なので、
  // 上半分かつ最大級の文字行を強く優先。
  const blacklist=/TEL|電話|FAX|住所|〒|レシート|領収|担当|日時|日付|合計|小計|消費税|税率|現金|釣銭|お預り|クレジット|カード|番号|登録番号|営業時間|取引|商品|単価|数量|税込|税抜|ありがとう|毎度|http|www/i;
  const cands=[];
  const heights=[];
  lines.forEach(l=>l.words.forEach(w=>heights.push(Math.max(1,w.box.y1-w.box.y0))));
  heights.sort((a,b)=>a-b);
  const med=heights[Math.floor(heights.length/2)]||1;

  lines.forEach((l,i)=>{
    const y=l.cy/(pageHeight||1);
    if(y>.75)return;
    const t=l.words.map(w=>w.text).join(' ').replace(/\s+/g,' ').trim();
    if(t.length<2||t.length>70||blacklist.test(t))return;
    const letters=(t.match(/[A-Za-z\u3040-\u30ff\u3400-\u9fff]/g)||[]).length;
    const digits=(t.match(/\d/g)||[]).length;
    if(letters<2||digits>Math.max(3,t.length*.35))return;

    let score=(l.avgH/med)*45 + (1-y)*30;
    if(/店$|支店$|本店$|STORE|SHOP|CAFE|MART|DINER|HOTEL/i.test(t))score+=15;
    if(/[都道府県市区町村]\S*\d/.test(t))score-=20;
    cands.push({t,score});
  });

  cands.sort((a,b)=>b.score-a.score);
  const context=cands.slice(0,3).map(x=>x.t).join(' ');
  const sig=signature(context||text);

  // learned
  let learned=null;
  for(const r of merchantLearning){
    const sim=sigSim(sig,r.signature);
    if(sim>=.20&&(!learned||sim>learned.sim))learned={merchant:r.merchant,sim};
  }
  if(learned)return {merchant:learned.merchant,signature:sig};

  // dictionary
  for(const c of cands.slice(0,10)){
    for(const [name,re] of KNOWN){
      if(re.test(c.t))return {merchant:name,signature:sig};
    }
  }

  return {merchant:cands[0]?.t||'',signature:sig};
}

function parseAmountZoom(lines){
  // 拡大写真では「合計」と金額が一緒に写る前提。
  // 既存parseAmountを使いつつ、合計行の復元候補を追加。
  const amount=parseAmount(lines);
  if(amount)return amount;

  const total=/総?合計|お支払(?:い)?額?|ご請求額?|請求額|支払額|取引金額|カード支払|クレジット支払/;
  const excl=/小計|消費税|税率|内税|外税|釣銭|お釣|預り|預かり|ポイント|値引|割引/;

  for(let i=0;i<lines.length;i++){
    const raw=lines[i].words.map(w=>w.text).join(' ');
    const joined=raw.replace(/\s/g,'');
    if(excl.test(joined)||!total.test(joined))continue;

    // Text-level reconstruction: 1 , 234 / 1 234 / ¥ 1,234
    let t=normalizeText(raw)
      .replace(/(\d{1,3})\s*[,，]\s*(\d{3})(?!\d)/g,'$1,$2')
      .replace(/(^|[^\d])(\d{1,3})\s+(\d{3})(?!\d)/g,'$1$2$3');

    const matches=[...t.matchAll(/(?:¥\s*)?(\d{1,3}(?:,\d{3})+|\d{2,8})(?:円)?/g)];
    if(matches.length){
      const n=Number(matches[matches.length-1][1].replace(/,/g,''));
      if(n>=10&&n<10000000)return n;
    }
  }
  return '';
}

$('#analyzeMultiBtn').onclick=async()=>{
  if(!(multiPhotos.full&&multiPhotos.merchant&&multiPhotos.amount))return;
  $('#captureDialog').close();

  editingId=null;resetDialog();
  $('#entryTitle').textContent='読み取り確認';
  $('#ocrBox').classList.remove('hidden');
  $('#ocrHint').classList.remove('hidden');
  $('#dateInput').value='';$('#merchantInput').value='';$('#amountInput').value='';
  $('#entryDialog').showModal();

  try{
    $('#ocrProgress').style.width='0%';

    // 1. 全体
    const full=await recognizeOne(multiPhotos.full,'全体',0,34);
    const date=parseDate(full.text);

    // 2. 店名アップ
    const merchantZoom=await recognizeOne(multiPhotos.merchant,'店名',34,67);
    const merchantInfo=parseMerchantZoom(merchantZoom.lines,merchantZoom.canvas.height,merchantZoom.text);

    // 3. 合計アップ
    const amountZoom=await recognizeOne(multiPhotos.amount,'合計',67,100);
    let amount=parseAmountZoom(amountZoom.lines);

    // フォールバック：合計アップで取れなければ全体から
    if(!amount)amount=parseAmount(full.lines);

    // 店名フォールバック：アップで取れなければ全体から
    let merchant=merchantInfo.merchant;
    let sig=merchantInfo.signature;
    if(!merchant){
      const fallback=parseMerchant(full.lines,full.canvas.height);
      merchant=fallback.merchant;sig=fallback.signature;
    }

    pendingMerchantSignature=sig||'';
    $('#dateInput').value=date||isoToday();
    $('#merchantInput').value=merchant||'';
    $('#amountInput').value=amount||'';

    // プレビューは全体写真を表示
    $('#receiptPreview').src=URL.createObjectURL(multiPhotos.full);
    $('#receiptPreview').classList.remove('hidden');

    const missing=[];
    if(!merchant)missing.push('店名');
    if(!amount)missing.push('合計金額');
    $('#ocrStatus').textContent=missing.length
      ? `読み取り完了（${missing.join('・')}を確認）`
      : '3枚の読み取り完了';

    $('#debugBox').textContent=
      '【全体】\n'+full.text.slice(0,500)+
      '\n\n【店名アップ】\n'+merchantZoom.text.slice(0,500)+
      '\n\n【合計アップ】\n'+amountZoom.text.slice(0,500);

    console.log('multi OCR',{
      date,merchant,amount,
      full:full.text,
      merchantText:merchantZoom.text,
      amountText:amountZoom.text
    });
  }catch(err){
    console.error(err);
    $('#ocrStatus').textContent='読み取りに失敗しました。撮影し直すか手動入力してください。';
    $('#dateInput').value=isoToday();
  }
};
